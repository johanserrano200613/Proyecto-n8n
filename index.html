<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalentFlow AI — Postúlate</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="marca">TalentFlow <span>AI</span></div>
    <a href="rrhh.html">Acceso RRHH →</a>
  </header>
  <main class="container">
    <h1>TalentFlow <span>AI</span></h1>
    <p class="subtitle">Postula tu hoja de vida. Nuestra IA la analiza y el equipo de RRHH revisa tu perfil con prioridad según tu compatibilidad.</p>

    <form id="postulacionForm" method="POST" enctype="multipart/form-data"
          action="https://reseto.app.n8n.cloud/webhook/Paguina-web">

      <label for="nombre">Nombre completo *</label>
      <input type="text" id="nombre" name="nombre" required />

      <label for="correo">Correo electrónico *</label>
      <input type="email" id="correo" name="correo" required />

      <label for="telefono">Teléfono *</label>
      <input type="tel" id="telefono" name="telefono" required />

      <label for="vacante">Vacante *</label>
      <select id="vacante" name="vacante" required>
        <option value="">Cargando vacantes...</option>
      </select>

      <label for="experiencia">Años de experiencia *</label>
      <select id="experiencia" name="experiencia" required>
        <option value="">— Selecciona —</option>
        <option value="Sin experiencia">Sin experiencia</option>
        <option value="Menos de 1 año">Menos de 1 año</option>
        <option value="1 - 2 años">1 - 2 años</option>
        <option value="3 - 5 años">3 - 5 años</option>
        <option value="Más de 5 años">Más de 5 años</option>
      </select>

      <label for="tecnologias">Tecnologías, herramientas o conocimientos principales *</label>
      <input type="text" id="tecnologias" name="tecnologias"
             placeholder="Ej: Java, SQL, Excel, Figma..." required />

      <label for="cv">Hoja de vida (PDF o imagen) *</label>
      <input type="file" id="cv" name="cv"
             accept="application/pdf,image/jpeg,image/png" required />
      <small class="hint">Acepta PDF con texto, PDF escaneado o foto de la hoja de vida (JPG/PNG).</small>

      <label class="checkbox">
        <input type="checkbox" id="acepta" name="acepta" required />
        Acepto el tratamiento de mis datos personales *
      </label>

      <button type="submit" id="btn">Enviar postulación</button>

      <div class="msg" id="msg"></div>
      <div id="confirmBox" class="result-box"></div>
    </form>

  </main>

  <script src="script.js"></script>
</body>
</html>
